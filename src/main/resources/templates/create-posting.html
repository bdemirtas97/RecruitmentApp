<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common_head(pageTitle='Create New Job Posting')}"></head>
<body class="portal-page">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="header">
        <h1>Create New Job Posting</h1>
    </div>
    <div class="card">
        <form th:action="@{/postings}" th:object="${createPostingRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error-message"></p></div>

            <div>
                <label for="title">Job Title:</label>
                <input type="text" id="title" th:field="*{title}" required />
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error-text"></p>
            </div>
            <div>
                <label for="details">Job Description:</label>
                <textarea id="details" th:field="*{details}" rows="10"></textarea>
                <p th:if="${#fields.hasErrors('details')}" th:errors="*{details}" class="error-text"></p>
            </div>
            <div>
                <label for="location">Location:</label>
                <input type="text" id="location" th:field="*{location}" required/>
            </div>
            <div>
                <label for="level">Level (e.g., Senior, Junior):</label>
                <input type="text" id="level" th:field="*{level}" required/>
            </div>
            <div>
                <label for="workingType">Working Type (e.g., Full-time):</label>
                <input type="text" id="workingType" th:field="*{workingType}" required/>
            </div>
            <div>
                <label for="workplace">Workplace (e.g., Remote, Hybrid):</label>
                <input type="text" id="workplace" th:field="*{workPlace}" required/>
            </div>
            <div>
                <label for="keywords">Keywords (comma-separated):</label>
                <input type="text" id="keywords" th:field="*{keywords}" required/>
            </div>
            <div>
                <label for="hiringManagerId">Assign Hiring Manager:</label>
                <select id="hiringManagerId" th:field="*{hiringManagerId}" required>
                    <option value="">Select a Hiring Manager...</option>
                    <option th:each="manager : ${hiringManagers}"
                            th:value="${manager.id}"
                            th:text="${manager.fullName}">
                    </option>
                </select>
                <p th:if="${#fields.hasErrors('hiringManagerId')}" th:errors="*{hiringManagerId}" class="error-text"></p>
            </div>
            <hr>
            <div>
                <button type="submit">Save as Draft</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
