<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common_head(pageTitle='Employee Registration')}"></head>
<body class="public-page">
<div class="public-container" style="max-width: 500px;">
  <div class="card">
    <h1>Employee Registration</h1>
    <p>Create your company account.</p>
    <form th:action="@{/signup/employee}" th:object="${signupRequest}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error-message"></p></div>
      <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required />
        <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-text"></p>
      </div>
      <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required />
        <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-text"></p>
      </div>
      <div>
        <label for="email">Work Email:</label>
        <input type="email" id="email" th:field="*{email}" required />
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></p>
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" th:field="*{password}" required />
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></p>
      </div>
      <div>
        <label for="role">Role:</label>
        <select id="role" th:field="*{role}" required>
          <option value="">Select a role...</option>
          <option value="RECRUITER">Recruiter</option>
          <option value="HIRING_MANAGER">Hiring Manager</option>
        </select>
        <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error-text"></p>
      </div>
      <div><button type="submit">Create Employee Account</button></div>
    </form>
    <p style="margin-top: 1rem;">Already have an employee account? <a th:href="@{/login/employee}">Login here</a>.</p>
  </div>
</div>
</body>
</html>
