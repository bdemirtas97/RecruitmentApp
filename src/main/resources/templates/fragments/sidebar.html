<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div class="sidebar" th:fragment="sidebar">
    <div class="sidebar-header">RecruiterApp</div>
    <ul class="sidebar-nav">
        <li><a th:href="@{/}">Home</a></li>

        <li sec:authorize="hasAuthority('CANDIDATE')"><a th:href="@{/candidate/profile}">My Profile</a></li>
        <li sec:authorize="hasAuthority('CANDIDATE')">
            <a th:href="@{/candidate/postings}">Job Postings</a>
        </li>
        <li sec:authorize="hasAuthority('CANDIDATE')">
            <a th:href="@{/candidate/applications}">My Applications</a>
        </li>

        <li sec:authorize="hasAnyAuthority('RECRUITER', 'HIRING_MANAGER')"><a th:href="@{/employee/profile}">My Profile</a></li>
        <li sec:authorize="hasAnyAuthority('RECRUITER', 'HIRING_MANAGER')"><a th:href="@{/postings}">Manage Postings</a></li>
    </ul>
    <div class="sidebar-footer" sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="logout-button" style="width: 100%;">Sign Out</button>
        </form>
    </div>
</div>
</body>
</html>
