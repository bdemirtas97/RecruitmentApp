<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common_head(pageTitle='Candidate Signup')}"></head>
<body class="public-page">
<div class="public-container" style="max-width: 500px;">
  <div class="card">
    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-message">
      Default message text (will be replaced).
    </div>
    <h1>Candidate Signup</h1>
    <p>Create your account to get started.</p>
    <form th:action="@{/signup/candidate}" th:object="${signupRequest}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div th:if="${#fields.hasGlobalErrors()}"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error-message"></p></div>
      <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required />
        <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-text"></p>
      </div>
      <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required />
        <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-text"></p>
      </div>
      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></p>
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" th:field="*{password}" required />
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></p>
      </div>
      <div><button type="submit">Create Account</button></div>
    </form>
    <p style="margin-top: 1rem;">Already have an account? <a th:href="@{/login/candidate}">Login here</a>.</p>
  </div>
</div>
</body>
</html>
