<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Recruitment App</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">RecruitApp</div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/}">Home</a></li>
            <li sec:authorize="hasAuthority('CANDIDATE')"><a th:href="@{/candidate/profile}">My Profile</a></li>
            <li sec:authorize="hasAnyAuthority('RECRUITER', 'HIRING_MANAGER')"><a th:href="@{/employee/profile}">My Profile</a></li>
            <li sec:authorize="hasAnyAuthority('RECRUITER', 'HIRING_MANAGER')"><a th:href="@{/postings}">Job Postings</a></li>
            <li sec:authorize="hasAnyAuthority('CANDIDATE')"><a th:href="@{/candidate/applications}">My Applications</a></li>
        </ul>
        <div class="sidebar-footer" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="logout-button" style="width: 100%;">Sign Out</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 th:text="${pageTitle}">Welcome</h1>
        </div>
        <div th:replace="${content}"></div>
    </div>
</div>

</body>
</html>
