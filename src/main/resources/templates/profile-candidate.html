<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common_head(pageTitle='My Candidate Profile')}"></head>
<body class="portal-page">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">
  <div class="header">
    <h1>My Candidate Profile</h1>
  </div>
  <div class="card">
    <div th:if="${errorMessage}" th:text="${errorMessage}" class="error-message">
      Default message text (will be replaced).
    </div>
    <div th:if="${param.updateSuccess}" class="success-message">Profile updated successfully!</div>
    <form th:action="@{/candidate/profile}" th:object="${profileUpdate}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <h3>Your Details</h3>
      <p>Your login email is <strong th:text="${profileDetails.email}"></strong>.</p>
      <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" />
        <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-text"></p>
      </div>
      <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" />
        <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-text"></p>
      </div>
      <div>
        <label for="contactEmail">Contact Email:</label>
        <input type="email" id="contactEmail" th:field="*{contactEmail}" />
        <p th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}" class="error-text"></p>
      </div>
      <div>
        <label for="contactPhone">Contact Phone:</label>
        <input type="tel" id="contactPhone" th:field="*{contactPhone}" />
      </div>
      <hr>
      <h3>Resume</h3>
      <div>
        <label for="resumeFile">Upload New Resume (PDF):</label>
        <input type="file" id="resumeFile" name="resumeFile" accept=".pdf" />
        <p th:if="${profileDetails.resumeUrl != null}" style="margin-top: 10px;">
          Current Resume: <a th:href="${profileDetails.resumeUrl}" target="_blank">View/Download</a>
        </p>
      </div>
      <hr>
      <div><button type="submit">Update Profile</button></div>
    </form>
  </div>
</div>

</body>
</html>
